    <!--
      Google Tag Manager bootstrap is handled in JS (src/lib/tracking.ts) so it
      respects the TRACKING config and never loads an empty/invalid GTM ID.
      The dataLayer is pre-initialized here so any push that happens before
      React hydrates is still captured.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
    </script>
    <script>
      // Strip leftover hash routing from old URLs (e.g. /#/, /#/events).
      // Migrates browser history entries from hash routing to clean paths.
      (function () {
        try {
          var h = window.location.hash;
          if (h && h.startsWith('#/')) {
            var newPath = h.slice(1) || '/';
            window.history.replaceState(null, '', newPath + window.location.search);
          } else if (h === '#' || h === '#/') {
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
          }
        } catch (e) {}
      })();
    </script>

      loader from src/lib/tracking.ts. The placeholder iframe below is left as
      a documented spot for you to paste the GTM-XXXXXXX ID if you want a
      noscript fallback for the small fraction of users with JS disabled.
    -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-T39JPZVF"
        height="0"
        width="0"
